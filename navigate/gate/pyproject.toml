[project]
name = "navgate"
version = "0.1.0"
description = "XLeRobot の台車の上で ARKit の姿勢が使えるかを判定するための、記録と解析。iPad の側は pocketsensor を使う"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pocketsensor[discovery]",
    "numpy>=1.26",
    "pyzmq>=26",
]

[project.scripts]
gate-record = "navgate.record:main"
gate-analyze = "navgate.analysis:main"
arm-zmq = "navgate.arm_client:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navgate"]

[tool.uv.sources]
pocketsensor = { path = "../../../pocketsensor/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
