[project]
name = "lerobot_teleoperator_xlerobot_quest"
version = "0.1.0"
description = "Quest のコントローラで XLeRobot の両腕・head・台車を動かす LeRobot Teleoperator。IK は closed_form / pyroki"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "lerobot==0.6.1",
  "numpy",
]

[project.optional-dependencies]
# VR サーバと IK。jax / pyroki / viser を引き込むので重い。
# 契約層と純ロジックのテストはこれ無しで走る。
#
# pyroki は PyPI に無く、teleop-xr[ik] の宣言だけでは解決できない
# （uv: "pyroki was not found in the package registry"）。git のリビジョンを直接指す。
# jaxls も PyPI に無いが、pyroki が自分の依存として git の HEAD を指しているので、
# ここで別のリビジョンを固定すると URL の衝突で解決に失敗する。pyroki に任せる。
# xacro は teleop_xr.ram が import するのに teleop-xr 1.3.5 が宣言していない依存。
vr = [
  "teleop-xr[ik]==1.3.5",
  "pyroki @ git+https://github.com/chungmin99/pyroki.git@388e43e1fc0d0ee382968d3dd72970fd62a0450c",
  "xacro==2.1.1",
]
# 公式の XLerobotVRTeleop（--teleop.type=xlerobot_vr_official）が使う XLeVR の依存。
# 公式の VR の plugin（lerobot_teleoperator_xlerobot_vr）は PyPI に無いので、install.sh が clone から入れる。
# XLeVR の requirements.txt には torch と pynput もあるが、この経路では import されない
xlevr = [
  "scipy",
  "websockets",
  "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_teleoperator_xlerobot_quest"]

[tool.hatch.metadata]
# git 直接参照（pyroki）を optional-dependencies に書くために要る
allow-direct-references = true
